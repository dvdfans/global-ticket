<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#DA3A2C">
  <title>登录 - 环球度假</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #F0F2F5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #fff; border-radius: 16px; padding: 32px 28px; width: 340px; max-width: 90vw; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo-icon { width: 56px; height: 56px; border-radius: 50%; background: #DA3A2C; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; margin-bottom: 8px; }
    .logo h1 { font-size: 20px; font-weight: 800; color: #1A1A1A; }
    .logo p { font-size: 12px; color: #999; margin-top: 4px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #E5E6EB; border-radius: 8px; font-size: 14px; outline: none; transition: border .2s; box-sizing: border-box; }
    input:focus { border-color: #DA3A2C; }
    input::placeholder { color: #C0C0C0; }
    .field { margin-bottom: 14px; }
    .field label { font-size: 12px; color: #666; margin-bottom: 4px; display: block; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #DA3A2C; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .btn:active { opacity: .85; }
    .msg { font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }
    .msg.ok { color: #389C39; }
    .msg.err { color: #DA3A2C; }
    .back { text-align: center; margin-top: 16px; font-size: 13px; }
    .back a { color: #DA3A2C; text-decoration: none; }
    .user-info { text-align: center; margin-bottom: 20px; }
    .user-info .avatar { font-size: 40px; margin-bottom: 8px; }
    .user-info .name { font-size: 16px; font-weight: 700; color: #1A1A1A; }
    .user-info .role { font-size: 12px; color: #999; margin-top: 4px; }
    .btn-outline { width: 100%; padding: 10px; border: 1px solid #E5E6EB; border-radius: 8px; background: #fff; color: #666; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #C0C0C0; }
  </style>
</head>
<body>
  <div class="login-box" id="app">
    <div class="logo">
      <div class="logo-icon">✈</div>
      <h1>环球度假</h1>
      <p>特价机票 · 报价查询系统</p>
    </div>
    <div id="loginForm">
      <div class="field">
        <label>用户名</label>
        <input id="loginUser" placeholder="请输入用户名" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="loginPwd" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn" onclick="doLogin()">登 录</button>
      <div class="msg" id="loginMsg"></div>
      <div class="back"><a href="index.html">← 返回报价页面</a></div>
    </div>
    <div id="userPanel" style="display:none">
      <div class="user-info">
        <div class="avatar" id="userAvatar">👤</div>
        <div class="name" id="userName"></div>
        <div class="role" id="userRole"></div>
      </div>
      <button class="btn" onclick="goHome()">进入报价页面</button>
      <button class="btn" id="dashBtn" onclick="window.open('https://358dca43f84e43379510a9528ec4a499.app.codebuddy.work','_blank')" style="display:none;margin-top:8px;background:#491B87">📈 图表看板</button>
      <button class="btn-outline" onclick="doLogout()">退出登录</button>
      <div class="msg" id="logoutMsg"></div>
    </div>
    <div class="footer">仅限内部使用 · 操作将被记录</div>
  </div>

  <script>
    // 2026-08-11: 账号密码哈希化（sha256(用户名+密码)），源码不再存明文。
    // 密码规则：Ivision@ + 6位数字 + 姓名末字拼音首字母（手机可输，用户定稿）。
    var ADMIN_LIST = [
      {user:'admin',hash:'f401b6220bf559896ff87696e85652b942f03d91e5f00df37f9d63b9b2a4a421',role:'admin',name:'陈浩'},
      {user:'adminzch',hash:'306bf2625096fd9d5236b5adee65f7893448b9deec73fc6dcf1bf954872e580f',role:'admin',name:'朱诚宏'},
      {user:'adminxxy',hash:'0eb500ed664d459b1e09022564043af360861429f1c61e18f4a4569dd3307a5e',role:'admin',name:'徐晓贇'},
    ];
    // 默认客服账号（哈希）
    var CS_DEFAULTS = [
      {user:'hq_zhangw',hash:'b07784cd7f14be5dbb14f0b9d32ad3f91e2418d66a2aef4679947928031d9a35',name:'张雯'},
      {user:'hq_liujq',hash:'b1bfa19d70ebd0d6f8d8329eae08925e0e55ce95ace4e40ba4244785561c3c19',name:'刘珏琼'},
      {user:'hq_liuw',hash:'2d8f15180e03ef581eba8a43efb90dfdb60dcffd7cbb962761c54863e39f3778',name:'刘薇'},
      {user:'hq_baif',hash:'d9077d895e9587b5c05403eb457bf52f133c64fc9eef12ed859d6469ab1eb5ac',name:'百芳'},
      {user:'hq_mifm',hash:'8e1e05e2a79a1ce5e8e7765739fa6d4c14562cf223c2db7e026e3c57b5b921bf',name:'宓方明'},
      {user:'hq_liurong',hash:'fdf23a5d42fd0243dc75d2831cccc643110d44a39aa110fa9ec5650375c9ee7b',name:'刘蓉'},
      {user:'hq_shenzy',hash:'7dcf939fc212d3e92225ee7bd8db5062ab13b03edb65fa283c4485ac9761e65f',name:'沈子元'},
      {user:'hq_sunyw',hash:'93accf1c2729889430e282fc6b9b900fefdff60242b52bc5d754571d4c572737',name:'孙奕雯'}
    ];

    // 2026-08-11: 账号静态化（不再依赖 localStorage cs_accounts，杜绝旧明文残留）；
    // 顺带清理历史明文缓存。
    function loadAccounts() {
      try { localStorage.removeItem('cs_accounts'); } catch(e) {}
      var accs = ADMIN_LIST.map(function(a){ return {user:a.user, hash:a.hash, role:a.role, name:a.name}; });
      CS_DEFAULTS.forEach(function(a){ accs.push({user:a.user, hash:a.hash, role:'cs', name:a.name}); });
      return accs;
    }

    // SHA-256 hex（crypto.subtle，https 环境可用）
    async function _sha256hex(str) {
      var buf = new TextEncoder().encode(str);
      var h = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(h)).map(function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
    }

    async function doLogin() {
      var user = document.getElementById('loginUser').value.trim();
      var pwd = document.getElementById('loginPwd').value.trim();
      var accounts = loadAccounts();
      var h = await _sha256hex(user + pwd);
      var found = null;
      for (var i=0; i<accounts.length; i++) {
        if (accounts[i].user === user && accounts[i].hash === h) { found = accounts[i]; break; }
      }
      var msg = document.getElementById('loginMsg');
      if (found) {
        localStorage.setItem('current_user', JSON.stringify({user:found.user,role:found.role,name:found.name}));
        // 记录登录事件（正式版统计；客服版不统计，见 customer_h5/login.html）
        msg.className = 'msg ok';
        msg.textContent = '✅ 登录成功，正在跳转...';
        var params = new URLSearchParams(location.search);
        var goto = params.get('goto') || 'index.html';
        setTimeout(function(){ window.location.href = goto; }, 600);
      } else {
        msg.className = 'msg err';
        msg.textContent = '❌ 用户名或密码错误';
      }
    }

    // 检查是否已登录
    (function() {
      var saved = localStorage.getItem('current_user');
      if (saved) {
        try {
          var u = JSON.parse(saved);
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('userPanel').style.display = 'block';
          document.getElementById('userAvatar').textContent = u.role === 'admin' ? '👑' : '👤';
          document.getElementById('userName').textContent = u.user + ' (' + u.name + ')';
          document.getElementById('userRole').textContent = u.role === 'admin' ? '管理员' : '客服';
          if (u.role === 'admin') {
            document.getElementById('dashBtn').style.display = 'block';
          }
        } catch(e) {}
      }
    })();

    function goHome() {
      var params = new URLSearchParams(location.search);
      var goto = params.get('goto') || 'index.html';
      window.location.href = goto;
    }
    function doLogout() {
      // 记录登出事件（正式版统计；客服版不统计，见 customer_h5/login.html）
      localStorage.removeItem('current_user');
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('userPanel').style.display = 'none';
      document.getElementById('loginMsg').className = 'msg ok';
      document.getElementById('loginMsg').textContent = '✅ 已退出登录';
    }
  </script>
</body>
</html>
