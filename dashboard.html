<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#DA3A2C">
  <title>数据看板 - 环球度假</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #F0F2F5; padding: 16px; max-width: 600px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 800; color: #1A1A1A; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #999; margin-bottom: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .card h2 { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 10px; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric { background: #F7F8FA; border-radius: 10px; padding: 14px; text-align: center; }
    .metric .num { font-size: 28px; font-weight: 800; }
    .metric .label { font-size: 11px; color: #999; margin-top: 2px; }
    .num-red { color: #DA3A2C; }
    .num-blue { color: #0C6FA8; }
    .num-green { color: #389C39; }
    .num-purple { color: #491B87; }
    .num-orange { color: #FF7D00; }
    .chart-wrap { position: relative; width: 100%; height: 220px; }
    .chart-wrap.tall { height: 280px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .back { font-size: 13px; color: #DA3A2C; text-decoration: none; }
    .loading { text-align: center; padding: 60px 0; color: #999; font-size: 14px; }
    .stat-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 12px; border-bottom: 1px solid #F5F5F5; }
    .stat-row:last-child { border: none; }
    .stat-label { color: #666; }
    .stat-val { font-weight: 700; color: #DA3A2C; }
    .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
    .badge-view { background: #E6F1FB; color: #0C6FA8; }
    .badge-copy { background: #EAF3DE; color: #389C39; }
    .badge-consult { background: #FAEEDA; color: #FF7D00; }
    .badge-other { background: #F5F5F5; color: #999; }
    .recent-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; border-bottom: 1px solid #F5F5F5; }
    .recent-item:last-child { border: none; }
    .recent-time { color: #C0C0C0; font-size: 11px; white-space: nowrap; }
    .recent-action { font-size: 11px; white-space: nowrap; }
    .recent-route { flex: 1; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-bar { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
    .tab-btn { padding: 6px 14px; border-radius: 16px; font-size: 12px; border: 1px solid #E5E6EB; background: #fff; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #DA3A2C; color: #fff; border-color: #DA3A2C; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <h1>数据看板</h1>
      <div class="sub" id="subtitle">加载中...</div>
    </div>
    <a href="index.html" class="back">← 返回</a>
  </div>

  <div id="content">
    <div class="loading" id="loading">加载统计数据...</div>
  </div>

  <div class="sub" style="text-align:center;margin-top:8px">数据来自 stats 服务器 · 实时汇总</div>

  <script>
    var STATS_API_BASE = 'https://major-calculators-classification-reservations.trycloudflare.com';
    var allData = [];
    var chartInstances = {};

    function init() {
      fetch(STATS_API_BASE + '/stats')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          allData = data;
          document.getElementById('loading').style.display = 'none';
          renderDashboard();
        })
        .catch(function(err) {
          document.getElementById('loading').innerHTML = '❌ 无法连接统计服务器<br><br>'
            + '<span style="font-size:12px;color:#999">' + err.message + '</span>'
            + '<br><br><button onclick="init()" style="padding:8px 24px;border:1px solid #DA3A2C;border-radius:6px;background:#fff;color:#DA3A2C;font-size:13px;cursor:pointer">重试</button>';
        });
    }

    function renderDashboard() {
      var total = allData.length;
      var detailViews = allData.filter(function(r){return r.action==='detail_view'}).length;
      var copies = allData.filter(function(r){return r.action==='copy_all'||r.action==='copy_card'}).length;
      var consults = allData.filter(function(r){return r.action==='consult'}).length;
      var qrClicks = allData.filter(function(r){return r.action==='qr_click'}).length;

      // 独立访客
      var users = {};
      allData.forEach(function(r){ users[r.user] = (users[r.user]||0)+1; });
      var uniqueUsers = Object.keys(users).length;

      // 航线排行
      var routes = {};
      allData.forEach(function(r){
        if (!r.route) return;
        if (!routes[r.route]) routes[r.route] = {views:0,copies:0,consults:0};
        if (r.action==='detail_view') routes[r.route].views++;
        if (r.action==='copy_all'||r.action==='copy_card') routes[r.route].copies++;
        if (r.action==='consult') routes[r.route].consults++;
      });
      var routeKeys = Object.keys(routes).sort(function(a,b){
        var sa = routes[a].views + routes[a].copies*2;
        var sb = routes[b].views + routes[b].copies*2;
        return sb - sa;
      });

      // 按天聚合
      var dayData = {};
      allData.forEach(function(r){
        var day = (r.timestamp||'').slice(0,10);
        if (!day) return;
        if (!dayData[day]) dayData[day] = {total:0,views:0,copies:0};
        dayData[day].total++;
        if (r.action==='detail_view') dayData[day].views++;
        if (r.action==='copy_all'||r.action==='copy_card') dayData[day].copies++;
      });
      var dayKeys = Object.keys(dayData).sort();

      document.getElementById('subtitle').textContent = '共 ' + total + ' 条记录 · ' + uniqueUsers + ' 个访客';

      var html = '';

      // 指标卡片
      html += '<div class="card"><div class="metric-grid">';
      html += '<div class="metric"><div class="num num-blue">' + detailViews + '</div><div class="label">卡片点击</div></div>';
      html += '<div class="metric"><div class="num num-green">' + copies + '</div><div class="label">复制次数</div></div>';
      html += '<div class="metric"><div class="num num-orange">' + consults + '</div><div class="label">咨询次数</div></div>';
      html += '<div class="metric"><div class="num num-purple">' + uniqueUsers + '</div><div class="label">独立访客</div></div>';
      html += '</div></div>';

      // 趋势图
      html += '<div class="card"><h2>每日趋势</h2><div class="chart-wrap" id="trendChart"><canvas id="trendCanvas" role="img" aria-label="每日操作趋势图"></canvas></div></div>';

      // 热门航线
      html += '<div class="card"><h2>热门航线</h2>';
      if (routeKeys.length) {
        routeKeys.slice(0, 8).forEach(function(k){
          var r = routes[k];
          html += '<div class="stat-row"><span class="stat-label">' + k + '</span>'
            + '<span><span class="stat-val" style="color:#0C6FA8">' + r.views + '</span> 点击 · <span class="stat-val" style="color:#389C39">' + r.copies + '</span> 复制</span></div>';
        });
      } else {
        html += '<div style="font-size:12px;color:#999;padding:8px 0">暂无数据</div>';
      }
      html += '</div>';

      // 动作分布
      html += '<div class="card"><h2>动作分布</h2><div class="chart-wrap tall" id="distChart"><canvas id="distCanvas" role="img" aria-label="动作分布饼图"></canvas></div></div>';

      // 近期操作
      html += '<div class="card"><h2>近期操作</h2>';
      var recent = allData.slice(-15).reverse();
      if (recent.length) {
        recent.forEach(function(r){
          var actionMap = {'detail_view':'查看','copy_all':'复制','copy_card':'复制','consult':'咨询','qr_click':'扫码','tab_home':'首页','tab_switch':'切换'};
          var a = actionMap[r.action] || r.action;
          var cls = r.action==='detail_view'?'badge-view':(r.action==='copy_all'||r.action==='copy_card')?'badge-copy':r.action==='consult'?'badge-consult':'badge-other';
          var time = (r.timestamp||'').slice(11,19);
          html += '<div class="recent-item">'
            + '<span class="recent-time">' + time + '</span>'
            + '<span class="badge ' + cls + ' recent-action">' + a + '</span>'
            + '<span class="recent-route">' + (r.route || r.quote || r.user || '') + '</span>'
            + '</div>';
        });
      } else {
        html += '<div style="font-size:12px;color:#999;padding:8px 0">暂无数据</div>';
      }
      html += '</div>';

      document.getElementById('content').innerHTML = html;

      // 渲染图表
      setTimeout(function(){ renderCharts(dayKeys, dayData, routeKeys, routes); }, 100);
    }

    function renderCharts(dayKeys, dayData, routeKeys, routes) {
      // 趋势图
      var tc = document.getElementById('trendCanvas');
      if (tc && dayKeys.length) {
        if (chartInstances.trend) chartInstances.trend.destroy();
        chartInstances.trend = new Chart(tc, {
          type: 'bar',
          data: {
            labels: dayKeys.map(function(d){return d.slice(5);}),
            datasets: [
              { label: '点击', data: dayKeys.map(function(d){return dayData[d].views;}), backgroundColor: '#0C6FA8', borderRadius: 4 },
              { label: '复制', data: dayKeys.map(function(d){return dayData[d].copies;}), backgroundColor: '#389C39', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 11 } } },
              y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.05)' } }
            }
          }
        });
      } else if (tc) {
        tc.parentNode.innerHTML = '<div style="text-align:center;padding:40px 0;color:#999;font-size:13px">暂无趋势数据</div>';
      }

      // 动作分布饼图
      var dc = document.getElementById('distCanvas');
      if (dc) {
        var acts = {};
        allData.forEach(function(r){
          var k = r.action==='detail_view'?'点击卡片':r.action==='copy_all'||r.action==='copy_card'?'复制':r.action==='consult'?'咨询':r.action==='qr_click'?'扫码':'其他';
          acts[k] = (acts[k]||0)+1;
        });
        var labels = Object.keys(acts);
        var values = labels.map(function(k){return acts[k];});
        var colors = ['#0C6FA8','#389C39','#FF7D00','#491B87','#C0C0C0'];
        if (chartInstances.dist) chartInstances.dist.destroy();
        chartInstances.dist = new Chart(dc, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{ data: values, backgroundColor: colors.slice(0,labels.length), borderWidth: 0 }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: { padding: 12, usePointStyle: true, font: { size: 11 } }
              }
            }
          }
        });
      }
    }

    init();
  </script>
</body>
</html>
