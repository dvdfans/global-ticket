<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#DA3A2C">
  <title>环球度假 - 简化版</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-bg"></div>
    <div class="header-content">
      <div class="brand">
        <img src="img/logo.png" class="logo" alt="环球度假">
        <div class="brand-text"><h1 class="brand-title">环球度假</h1></div>
        <span class="header-theme" onclick="toggleTheme()" id="headerTheme">☀️</span>
      </div>
      <div class="header-promo">限时特惠 · 先到先得</div>
      <div class="header-stats"><span id="stats-routes">0</span>条航线 · 数据更新于 <span id="stats-time">--</span></div>
      <span class="header-plane">✈</span>
    </div>
  </header>
  <nav class="tab-bar" id="tabBar">
    <div class="tab-scroll">
      <button class="tab" data-tab="home">首页</button>
      <button class="tab" data-tab="hot">热门</button>
      <button class="tab" data-tab="japan">日本</button>
      <button class="tab" data-tab="korea">韩国</button>
      <button class="tab" data-tab="seasia">东南亚</button>
      <button class="tab" data-tab="ganga">港澳</button>
    </div>
  </nav>
  <main class="card-list" id="cardList"><div class="loading">加载中...</div></main>
  <div class="float-filter" id="floatFilter" onclick="openFilter()">▦ 筛选</div>
  <div class="modal" id="filterModal">
    <div class="modal-content" style="min-height:40vh;display:flex;flex-direction:column">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:16px;font-weight:700">筛选报价</span>
        <span onclick="closeFilter()" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--tag-bg);cursor:pointer;font-size:14px">×</span>
      </div>
      <div id="filterBody" style="flex:1;overflow-y:auto;padding:12px 16px"></div>
    </div>
  </div>
  <div class="modal" id="detailModal"><div class="modal-content" id="modalContent"></div></div>
  <div class="modal" id="shareModal"><div class="modal-content modal-qr" id="shareModalContent"></div></div>
  <div class="modal" id="csModal"><div class="modal-content" id="csModalContent"></div></div>
  <footer class="app-footer">
    <div class="qr-item" id="filterBtn"><div class="qr-img qr-filter-icon">▦</div><p>筛选</p></div>
    <div class="qr-item" id="qrCs"><img src="img/qr_cs.png" class="qr-img" alt="客服"><p>客服咨询</p></div>
    <div class="qr-item" id="qrShare"><div class="qr-img" id="qrLinkCanvas" style="width:72px;height:72px;border-radius:6px;overflow:hidden;padding:0;background:transparent;border:none"></div><p>分享报价</p></div>
  </footer>
  <script src="js/qrcode.min.js"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
