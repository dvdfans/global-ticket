<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#DA3A2C">
  <title>环球度假 - 特价机票·每日更新</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=102">
  <link rel="stylesheet" href="css/theme.css?v=102">
<script src="https://beacon.cdn.qq.com/sdk/4.5.9/beacon_web.min.js"></script>
<script>
(function(){
  try{
    var beacon=new BeaconAction({
      appkey:'0WEB06U85YBSLJNL',
      versionCode:'1.0.0',
      channelID:'share',
      delay:1000,
      sessionDuration:30*60*1000,
      isOversea:false,
      needReportRqdEvent:false
    });
    beacon.onDirectUserAction('preview_page_view',{
      'url':location.href,
      'referrer':document.referrer,
      'title':document.title,
      'sandbox_id':'4d48c0db65974179a8c59b43155e5ecb'
    });
  }catch(e){}
})();
</script></head>
<body>

  <!-- 固定顶部 -->
  <header class="app-header">
    <div class="header-bg"></div>
    <div class="header-content">
      <div class="brand">
        <img src="img/logo.png" class="logo" alt="环球度假" onclick="cycleTheme()" title="点击切换主题" style="cursor:pointer">
        <div class="brand-text">
          <h1 class="brand-title">环球度假</h1>
        </div>
        <span class="header-theme" onclick="toggleTheme()" id="headerTheme">☀️</span>
      </div>
      <div class="header-promo">
        限时特惠 · 先到先得
      </div>
      <div class="header-stats">
        <span id="stats-routes">0</span>条航线 · 数据更新于 <span id="stats-time">--</span>
      </div>
      <span class="header-plane">✈</span>
    </div>
  </header>

  <!-- 固定Tab栏 -->
  <nav class="tab-bar" id="tabBar">
    <div class="tab-scroll">
      <button class="tab" data-tab="home">首页</button>
      <button class="tab" data-tab="hot">热门</button>
      <button class="tab" data-tab="japan">日本</button>
      <button class="tab" data-tab="korea">韩国</button>
      <button class="tab" data-tab="seasia">东南亚</button>
      <button class="tab" data-tab="ganga">港澳</button>
      <button class="tab" data-tab="domestic">国内</button>
    </div>
  </nav>

  <!-- 中间滚动卡片区 -->
  <main class="card-list" id="cardList">
    <div class="loading">加载中...</div>
  </main>

  <!-- 固定底部条 -->
  <footer class="app-footer">
    <div class="qr-item" id="filterBtn">
      <div class="qr-img qr-filter-icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="搜索"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg></div>
      <p>搜索</p>
    </div>
    <div class="qr-item" id="qrCs">
      <img src="img/qr_cs.png" class="qr-img" alt="客服">
      <p>客服咨询</p>
    </div>
    <div class="qr-item" id="qrShare">
      <div class="qr-img" id="qrLinkCanvas" style="width:72px;height:72px;border-radius:6px;overflow:hidden;padding:0;background:transparent;border:none"></div>
      <p>分享报价</p>
    </div>
  </footer>

  <!-- 分享弹层（含二维码） -->
  <div class="modal" id="shareModal">
    <div class="modal-content modal-qr" id="shareModalContent"></div>
  </div>

  <!-- 详情弹层（点击卡片显示） -->
  <div class="modal" id="detailModal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <!-- 客服二维码弹层 -->
  <div class="modal" id="csModal">
    <div class="modal-content modal-qr" id="csModalContent"></div>
  </div>

  <!-- 筛选弹层 -->
  <div class="modal" id="filterModal">
    <div class="modal-content" style="height:97vh;max-height:97vh;display:flex;flex-direction:column;overflow:hidden">
      <div class="filter-modal-hd" style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span class="fml-title" style="font-size:16px;font-weight:700;cursor:pointer" onclick="location.href='login.html?goto='+encodeURIComponent(location.pathname+location.search)">筛选报价</span>
        <span class="fml-close" onclick="closeFilter()" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--tag-bg);cursor:pointer;font-size:14px">×</span>
      </div>
      <div id="filterBody" style="flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px"></div>
      <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px">
        <button onclick="resetFilter()" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer">重置</button>
        <button id="filterCopyBtn" onclick="if(!this.classList.contains('disabled'))copyFilterResults()" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s">📋 复制</button>
        <button id="filterApplyBtn" onclick="applyFilter()" style="flex:2;padding:10px;border:none;border-radius:8px;background:var(--brand,var(--red));color:var(--brand-text,#fff);font-size:13px;font-weight:700;cursor:pointer">查看 <span id="filterCountDisplay">0</span> 条结果</button>
      </div>
    </div>
  </div>

  <script src="js/qrcode.min.js"></script>
  <script src="js/core.js?v=102"></script>
  <script src="js/data.js?v=94"></script>
  <script src="js/sort.js?v=96"></script>
  <script src="js/app_main.js?v=137"></script>
</body>
</html>
