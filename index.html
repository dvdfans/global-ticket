<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#004386">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="canonical" href="https://huanqiudujia.com/">
<title>环球度假 · 正式版网站已上线</title>
<style>
  /* mg- 前缀作用域（独立迁移海报页，不与任何 H5 样式冲突） */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(155deg, #002B5C 0%, #004386 38%, #0D6FA7 72%, #26B7BC 100%);
    color: #1a2433;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    position: relative; overflow: hidden;
  }
  .mg-deco { position: absolute; border-radius: 50%; filter: blur(2px); pointer-events: none; }
  .mg-d1 { width: 340px; height: 340px; right: -120px; top: -110px; background: rgba(250,190,0,.14); }
  .mg-d2 { width: 260px; height: 260px; left: -100px; bottom: -90px; background: rgba(38,183,188,.22); }
  .mg-d3 { width: 120px; height: 120px; left: 12%; top: 14%; background: rgba(255,255,255,.07); }
  .mg-card {
    position: relative; z-index: 2;
    width: 100%; max-width: 520px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 24px 70px rgba(0, 20, 45, .45);
    padding: 44px 30px 30px;
    text-align: center;
  }
  .mg-brand {
    font-size: 15px; letter-spacing: 6px; color: #004386;
    font-weight: 700; margin-bottom: 4px;
  }
  .mg-brand-en { font-size: 10px; letter-spacing: 3px; color: #8aa0b8; margin-bottom: 22px; }
  .mg-badge {
    display: inline-block; background: #FABE00; color: #00304f;
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    padding: 6px 18px; border-radius: 999px; margin-bottom: 20px;
  }
  .mg-h1 { font-size: 30px; line-height: 1.3; color: #0d2137; font-weight: 800; margin-bottom: 12px; }
  .mg-h1 .mg-hl { color: #0D6FA7; }
  .mg-sub { font-size: 14.5px; color: #5a6b80; line-height: 1.75; margin-bottom: 26px; }
  .mg-sub b { color: #D9392B; }
  .mg-url {
    display: block; text-decoration: none;
    background: #f2f7fb; border: 1.5px dashed #9dc3dd;
    border-radius: 14px; padding: 14px 12px; margin-bottom: 22px;
    font-size: 19px; font-weight: 800; color: #0D6FA7;
    letter-spacing: .4px; word-break: break-all;
    transition: background .2s;
  }
  .mg-url:active { background: #e2eef7; }
  .mg-btn {
    display: block; text-decoration: none;
    background: linear-gradient(135deg, #004386, #0D6FA7);
    color: #fff; font-size: 17.5px; font-weight: 700; letter-spacing: 2px;
    padding: 15px 0; border-radius: 999px;
    box-shadow: 0 10px 24px rgba(13,111,167,.38);
    margin-bottom: 16px;
  }
  .mg-btn:active { transform: scale(.98); }
  .mg-count { font-size: 13px; color: #8296ab; margin-bottom: 26px; }
  .mg-count a { color: #0D6FA7; text-decoration: underline; }
  .mg-feats {
    display: flex; justify-content: center; gap: 0;
    border-top: 1px solid #edf2f7; padding-top: 20px; margin-bottom: 18px;
  }
  .mg-feat { flex: 1; font-size: 13px; color: #33475e; font-weight: 600; }
  .mg-feat + .mg-feat { border-left: 1px solid #edf2f7; }
  .mg-feat span { display: block; font-size: 10px; color: #9db0c3; letter-spacing: 2px; margin-top: 3px; }
  .mg-footer { font-size: 11.5px; color: #a5b4c4; line-height: 1.8; }
  .mg-footer a { color: #8aa0b8; text-decoration: none; }
  @media (max-width: 380px) { .mg-h1 { font-size: 25px; } .mg-url { font-size: 16px; } }
</style>
</head>
<body>
  <div class="mg-deco mg-d1"></div>
  <div class="mg-deco mg-d2"></div>
  <div class="mg-deco mg-d3"></div>

  <main class="mg-card">
    <div class="mg-brand">环球度假</div>
    <div class="mg-brand-en">HUANQIU HOLIDAY</div>

    <div class="mg-badge">官方公告</div>
    <h1 class="mg-h1">正式版网站<span class="mg-hl">已上线</span></h1>
    <p class="mg-sub">原测试版网址已全面废弃，请访问并收藏新官网<br><b>本页将于数秒后自动跳转</b></p>

    <a class="mg-url" href="https://huanqiudujia.com/">huanqiudujia.com</a>

    <a class="mg-btn" href="https://huanqiudujia.com/">立即前往新官网</a>

    <p class="mg-count"><span id="mg-n">5</span> 秒后自动前往 · <a href="javascript:void(0)" id="mg-cancel">取消自动跳转</a></p>

    <div class="mg-feats">
      <div class="mg-feat">特价机票<span>SPECIAL FARES</span></div>
      <div class="mg-feat">每日更新<span>DAILY UPDATE</span></div>
      <div class="mg-feat">官方直营<span>OFFICIAL</span></div>
    </div>

    <p class="mg-footer">环球度假 © 2026 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2024044050号-3</a></p>
  </main>

  <noscript><meta http-equiv="refresh" content="5; url=https://huanqiudujia.com/"></noscript>
  <script>
    (function () {
      var n = 5, el = document.getElementById('mg-n'),
          timer = setInterval(function () {
            n -= 1;
            if (n <= 0) { clearInterval(timer); location.replace('https://huanqiudujia.com/'); return; }
            el.textContent = n;
          }, 1000);
      document.getElementById('mg-cancel').onclick = function () {
        clearInterval(timer); el.textContent = '已';
        this.parentNode.innerHTML = '自动跳转已取消，可点击上方链接前往新官网';
      };
    })();
  </script>
</body>
</html>
