  <script>
    /* 主题提前上色：与 login.html / zizhi.html 对齐，读同一套 localStorage（pq_theme / theme），
       在首屏绘制前挂到 <html>，避免「先按 :root 默认色画一遍再变」的闪色。
       ★为什么必须放 <head>：app_main.js 在 </body> 前才加载，等到那时首屏已经画完了。
       ★默认主题＝潮汐青（2026-09-18 Howard 定案），故兜底值取 cyan。 */
    (function () {
      try {
        var OK = { cyan: 1, red: 1, navy: 1, blue: 1, green: 1, purple: 1 };
        var t = localStorage.getItem('pq_theme') || 'cyan';
        if (!OK[t]) t = 'cyan';
        document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <script>
    /* 给 <html> 挂 js-dock —— 语义 = 「脚本可用」标记，用于解锁备案行的【收起】能力。
       ★注意方向：默认就是【可见】（首屏、无 JS 都可见），本类只额外允许「收起」。
         所以脚本不执行时，备案行永远按正常流可见 —— 安全降级，不会两头空。
       ★放在 <head>：与首屏同帧就绪，避免状态切换时样式晚到。 */
    document.documentElement.classList.add('js-dock');
  </script>

  <script>
  /* ══ 底部坞状态机（Howard 2026-09-18 四次定案）════════════════════════════════
     默认（首屏）            → 备案行【完整可见】  ← 纯 CSS 决定，零依赖、无跳动
     点击任意元素            → 【下沉不可见】（滑动区 / 导航键 / 搜索 / 客服 / 分享 / 弹层…）
     点 logo（切主题）、点 ☀️🌙（切深浅） → 回到【可见】
     坞上向上滑 / 向下滑     → 切换可见 / 不可见（手势保留）
     点备案行内部、点坞的空白处 → 不收起（后者兼作桌面端手动展开入口）
     ★降级：本脚本不执行 ⇒ 无 html.js-dock ⇒ 收起样式不生效 ⇒ 备案行永远可见。
     ★合规：首屏可见是本方案的合规基础 —— 它有纯 CSS 保证，不依赖任何脚本。 */
  (function () {
    var dock = document.querySelector('.bottom-dock');
    var legal = document.getElementById('legalFooter');
    if (!dock || !legal) return;

    var collapsed = false;
    var gestureAt = 0;   /* 手势结束时间戳：用于压掉紧随其后的 click */

    /* ── ① 高度同步（只服务 #toast 浮层定位）─────────────────────
       ★收起/展开【不依赖任何测量值】：收起由 CSS 把备案行移出文档流，
         坞的 offsetHeight 随之自动变回「动作条高度」—— 直接读它即可，无需扣减。
         这正是五次定案的要点：把「藏多深」与「动作条贴底」从测量值上解耦。 */
    function syncDock() {
      document.documentElement.style.setProperty('--dock-h', Math.ceil(dock.offsetHeight) + 'px');
    }

    /* ── ② 状态切换 ──────────────────────────────────────────────── */
    function setCollapsed(v) {
      if (collapsed === v) return;
      collapsed = v;
      dock.classList.toggle('dock-collapsed', v);
      syncDock();
    }

    /* ── ③ 点击规则（capture 阶段，先于各元素自身的 onclick）────── */
    document.addEventListener('click', function (e) {
      /* 手势刚结束时浏览器仍可能补发 click —— 不挡的话「上滑展开」会被立刻收回 */
      if (Date.now() - gestureAt < 400) return;
      var t = e.target;
      if (!t || !t.closest) { setCollapsed(true); return; }
      /* a. 主题切换（logo）/ 浅色深色切换（☀️🌙）→ 展开可见 */
      if (t.closest('.logo') || t.closest('#headerTheme')) { setCollapsed(false); return; }
      /* b. 点备案行自身（含其中链接）→ 不收起 */
      if (t.closest('#legalFooter')) return;
      /* c. 点坞的空白处（不是 搜索/客服/分享 三个按钮）→ 展开（桌面端手动入口） */
      if (t.closest('.bottom-dock') && !t.closest('.qr-item')) { setCollapsed(false); return; }
      /* d. 其余任意点击 → 收起 */
      setCollapsed(true);
    }, true);

    /* ── ④ 手势：坞上向上滑 = 展开，向下滑 = 收起（阈值 22px，短按不误触发按钮）── */
    var tracking = false, y0 = 0, TH = 22;
    dock.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { tracking = false; return; }
      y0 = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });
    dock.addEventListener('touchmove', function (e) {
      if (!tracking) return;
      var dy = e.touches[0].clientY - y0;
      if (collapsed && dy <= -TH) { setCollapsed(false); gestureAt = Date.now(); }
      else if (!collapsed && dy >= TH) { setCollapsed(true); gestureAt = Date.now(); }
    }, { passive: true });
    function stopTrack() { tracking = false; }
    dock.addEventListener('touchend', stopTrack, { passive: true });
    dock.addEventListener('touchcancel', stopTrack, { passive: true });

    /* ── ⑤ Esc 收起 ──────────────────────────────────────────────── */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.keyCode === 27) setCollapsed(true);
    });

    /* ── ⑥ 初始化与尺寸跟踪 ──────────────────────────────────────── */
    syncDock();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncDock);
    window.addEventListener('resize', syncDock);
    window.addEventListener('orientationchange', syncDock);
    if (window.ResizeObserver) new ResizeObserver(syncDock).observe(dock);
  })();
  </script>
